services:
  db:
    image: postgres:16
    container_name: brainplizz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: brainplizz
      POSTGRES_USER: brainplizz
      POSTGRES_PASSWORD: brainplizz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: