services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: brainplizz
      POSTGRES_USER: brainplizz
      POSTGRES_PASSWORD: brainplizz_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainplizz -d brainplizz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: brainplizz
      DB_USER: brainplizz
      DB_PASSWORD: brainplizz_password
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: